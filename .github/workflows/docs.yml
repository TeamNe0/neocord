name: Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-pages
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOCS_DOMAIN: neocord.bajekek.com

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build test --filter=@teamneo/neocord-docs
        env:
          VITE_SITE_URL: https://${{ env.DOCS_DOMAIN }}
          VITE_TRAILING_SLASH: "true"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apps/docs/dist
          cname: ${{ env.DOCS_DOMAIN }}
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "docs: deploy ${{ github.sha }}"
